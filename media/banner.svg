<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="'DejaVu Sans', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#131c26"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- faint occupancy grid (right side) -->
  <g stroke="#18222e" stroke-width="1" opacity="0.5">
    <line x1="590" y1="0"  x2="590" y2="360"/><line x1="630" y1="0"  x2="630" y2="360"/>
    <line x1="670" y1="0"  x2="670" y2="360"/><line x1="710" y1="0"  x2="710" y2="360"/>
    <line x1="750" y1="0"  x2="750" y2="360"/><line x1="790" y1="0"  x2="790" y2="360"/>
    <line x1="830" y1="0"  x2="830" y2="360"/><line x1="870" y1="0"  x2="870" y2="360"/>
    <line x1="910" y1="0"  x2="910" y2="360"/><line x1="950" y1="0"  x2="950" y2="360"/>
    <line x1="990" y1="0"  x2="990" y2="360"/><line x1="1030" y1="0" x2="1030" y2="360"/>
    <line x1="1070" y1="0" x2="1070" y2="360"/><line x1="1110" y1="0" x2="1110" y2="360"/>
    <line x1="1150" y1="0" x2="1150" y2="360"/><line x1="1190" y1="0" x2="1190" y2="360"/>
    <line x1="590" y1="40"  x2="1280" y2="40"/><line x1="590" y1="80"  x2="1280" y2="80"/>
    <line x1="590" y1="120" x2="1280" y2="120"/><line x1="590" y1="160" x2="1280" y2="160"/>
    <line x1="590" y1="200" x2="1280" y2="200"/><line x1="590" y1="240" x2="1280" y2="240"/>
    <line x1="590" y1="280" x2="1280" y2="280"/><line x1="590" y1="320" x2="1280" y2="320"/>
  </g>

  <!-- text block -->
  <text x="70" y="100" fill="#5b6b7a" font-size="22" font-weight="bold" letter-spacing="3">ZERO STATE LOGIC   ·   ROMI LAB</text>
  <text x="68" y="210" fill="#e6edf3" font-size="96" font-weight="bold" font-family="ui-monospace,'DejaVu Sans Mono',monospace">romi_nav</text>
  <line x1="70" y1="224" x2="512" y2="224" stroke="#58a6ff" stroke-width="4"/>
  <text x="70" y="282" fill="#8b98a5" font-size="27">Human-in-the-Loop  Nav2  Recommendation  Harness</text>

  <!-- nav motif: travelled path + two-candidate fork -->
  <polyline points="760,250 830,232 900,212 968,196 1030,186" fill="none" stroke="#7c8c9e" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#96aabc">
    <circle cx="830" cy="232" r="5"/><circle cx="900" cy="212" r="5"/><circle cx="968" cy="196" r="5"/>
  </g>
  <!-- robot -->
  <circle cx="760" cy="250" r="11" fill="#c8d6e2"/>
  <line x1="760" y1="250" x2="778" y2="244" stroke="#c8d6e2" stroke-width="3"/>
  <!-- candidate A: nav2 (blue, solid) -->
  <line x1="1030" y1="186" x2="1150" y2="150" stroke="#58a6ff" stroke-width="4"/>
  <circle cx="1150" cy="150" r="6" fill="#58a6ff"/>
  <!-- candidate B: agent (green, dashed) -->
  <line x1="1030" y1="186" x2="1150" y2="232" stroke="#3fb950" stroke-width="4" stroke-dasharray="10 7"/>
  <circle cx="1150" cy="232" r="6" fill="#3fb950"/>
  <!-- goal ring -->
  <circle cx="1200" cy="150" r="13" fill="none" stroke="#f0883e" stroke-width="3"/>
  <circle cx="1200" cy="150" r="4" fill="#f0883e"/>
  <!-- legend -->
  <circle cx="1055" cy="300" r="5" fill="#58a6ff"/><text x="1066" y="305" fill="#8b98a5" font-size="17" font-family="ui-monospace,'DejaVu Sans Mono',monospace">nav2</text>
  <circle cx="1130" cy="300" r="5" fill="#3fb950"/><text x="1141" y="305" fill="#8b98a5" font-size="17" font-family="ui-monospace,'DejaVu Sans Mono',monospace">agent</text>
</svg>
